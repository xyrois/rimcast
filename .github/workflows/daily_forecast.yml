name: Nightly Forecast Update

on:
  schedule:
    - cron: '0 10 * * *' # Runs daily at 10:00 UTC (post-West Coast games)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install nba_api pandas numpy

      - name: Update Projections
        run: python .github/scripts/forecast.py

      - name: Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/forecasts.json
          git diff --staged --quiet || (git commit -m "chore: nightly forecast update [skip ci]" && git push)