name: Daily NBA Forecast Update

on:
  schedule:
    # Runs every morning at 10:00 UTC (6:00 AM EST)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install nba_api pandas numpy

      - name: Run Projection Model
        run: python .github/scripts/forecast.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/forecasts.json
          git diff --staged --quiet || (git commit -m "chore: update daily forecasts [skip ci]" && git push)